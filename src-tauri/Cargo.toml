[package]
name = "markart"
version = "0.1.1"
description = "A calm Markdown writing workspace"
authors = ["chikomago"]
license = "GPL-3.0-only"
repository = "https://github.com/Chikomago/Markart"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "markart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
notify = "8.2"
infer = "0.19"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-global-shortcut = "=2.3.2"
tempfile = "3.27"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
encoding_rs = "0.8.35"
git2 = { version = "0.20", default-features = false, features = ["https"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
serde_yaml_ng = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSPasteboard", "NSResponder", "NSImage", "NSAttributedString", "NSParagraphStyle", "NSText"] }
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKFrameInfo", "WKContentWorld", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
